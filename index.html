<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RPS — Sistema de Registro do police department</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
</head>
<body class="login-page">

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo-block">
          <img src="https://imgur.com/hNp5XDa.png"
               alt="Police Department" class="lspd-logo" />
          <div class="header-text">
            <div class="header-republic">STATE OF SAN ANDREAS</div>
            <div class="header-ministry">MINISTÉRIO DA JUSTIÇA E SEGURANÇA PÚBLICA</div>
            <div class="header-dept">POLICE DEPARTMENT</div>
            <div class="header-system">SISTEMA DE REGISTRO E PROTOCOLOS POLICIAIS</div>
          </div>
        </div>
        <div class="divider-gold"></div>
        <p class="login-subtitle">ACESSO RESTRITO — AGENTES AUTORIZADOS</p>
      </div>

      <form class="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="login">LOGIN DO AGENTE</label>
          <input type="text" id="login" placeholder="Ex: agente.silva" required autocomplete="off" />
        </div>
        <div class="form-group">
          <label for="senha">SENHA</label>
          <input type="password" id="senha" placeholder="••••••••" required />
        </div>
        <div id="login-error" class="login-error" style="display:none;"></div>
        <button type="submit" class="btn-login" id="btn-login">
          <span id="btn-text">ACESSAR SISTEMA</span>
          <span id="btn-loading" style="display:none;">VERIFICANDO...</span>
        </button>
      </form>

      <div class="login-footer">
        <div class="footer-line">
          ⚠ O acesso não autorizado constitui crime conforme o Código Penal
        </div>
        <div class="footer-line small">RPS v2.4 — State Of San Andreas · Todos os direitos reservados </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
